<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>His Rating</title>
<link rel="manifest" href="manifest-er.json">
<link rel="apple-touch-icon" href="icon-er-180.png">

<style>
  :root { --bg:#07070a; --card:#121217; --text:#d6d6db; --head:#fff; --gold:#d4af37; --line:rgba(255,255,255,.09); }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 16px 60px; background:radial-gradient(1200px 500px at 50% -120px, #1b1620 0%, var(--bg) 70%) no-repeat, var(--bg); color:var(--text); font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; line-height:1.55; }
  .wrap { max-width:1000px; margin:0 auto; }
  header { text-align:center; padding:34px 0 14px; }
  h1 { font-family:Georgia,'Times New Roman',serif; font-weight:400; color:var(--gold); letter-spacing:2px; font-size:2rem; margin:0 0 6px; }
  .sub { margin:0; opacity:.75; font-size:.95rem; }
  .leiste { position:sticky; top:0; z-index:10; margin:10px -16px 22px; padding:10px 16px 12px; background:rgba(7,7,10,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .leiste-in { max-width:1000px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between; font-size:.9rem; }
  .bar { flex:1 1 180px; height:6px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; min-width:120px; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4fa874,#d4af37); transition:width .4s; }
  .chip-diff { padding:3px 10px; border-radius:20px; background:rgba(255,255,255,.07); }
  .chip-diff.an { background:rgba(212,175,55,.2); color:#f3e7c0; }

  .zeile { --c:#8b78e6; position:relative; background:linear-gradient(180deg,#15151b,#101014); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:14px; padding:18px 20px 18px; margin:0 0 20px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .zeile.her { --c:#d2507f; } .zeile.his { --c:#4a8fe0; }
  .kopf { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .nr { font-family:Georgia,serif; font-size:2.2rem; line-height:1; color:#fff; min-width:2ch; }
  .nr small { display:block; font-family:'Segoe UI',sans-serif; font-size:.65rem; letter-spacing:2px; text-transform:uppercase; opacity:.6; margin-bottom:2px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:.76rem; letter-spacing:.4px; padding:4px 11px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,.05); }
  .chip.her { border-color:#e58aa0; color:#ffd9e2; background:rgba(229,138,160,.14); }
  .chip.his { border-color:#7fb3e6; color:#d6e9fb; background:rgba(127,179,230,.14); }
  .karte { margin-left:auto; font-size:.8rem; opacity:.65; letter-spacing:1px; text-transform:uppercase; }

  .optionen { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .opt { background:rgba(255,255,255,.035); border:1px solid var(--line); border-radius:10px; padding:12px 14px 14px; font-size:.95rem; }
  .opt b { display:flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:1px; text-transform:uppercase; font-weight:600; color:var(--c); margin-bottom:6px; }
  .opt b span { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--c); color:#000; font-size:.72rem; }
  .opt em { display:block; font-style:normal; font-size:.72rem; opacity:.6; margin:-2px 0 6px; }

  .opt .text { margin:0 0 12px; min-height:3.2em; }
  .opt .status { font-size:.82rem; margin:0 0 10px; padding-top:10px; border-top:1px solid var(--line); }
  .opt .status b { display:inline; text-transform:none; letter-spacing:0; font-size:inherit; font-weight:600; color:#fff; margin:0; }
  .opt .status .alt { display:block; margin-top:2px; color:#f3e7c0; }
  .opt .btns { display:flex; flex-wrap:wrap; gap:6px; }
  .opt .btns button { padding:7px 11px; font-size:.82rem; }
  .opt.bew-A { border-color:#4fa874; } .opt.bew-B { border-color:#d4af37; } .opt.bew-C { border-color:#c23b4c; }
  .opt.diff { box-shadow:0 0 0 1px rgba(212,175,55,.55); }
  .unten { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .status { flex:1 1 220px; font-size:.88rem; }
  .status .alt { display:block; margin-top:2px; color:#f3e7c0; }
  .btns { display:flex; gap:8px; flex:0 1 auto; }
  .btns button { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); cursor:pointer; font-size:.88rem; transition:all .15s; }
  .btns button:hover { border-color:var(--gold); }
  .btns .e { font-size:1.25rem; line-height:1; }
  .btns button.sel { color:#fff; font-weight:600; }
  .btns button.sel.A { background:#2f7d51; border-color:#4fa874; }
  .btns button.sel.B { background:#8a6d1c; border-color:#d4af37; }
  .btns button.sel.C { background:#99303f; border-color:#c23b4c; }
  .zeile.geaendert { box-shadow:0 0 0 1px rgba(212,175,55,.55), 0 8px 24px rgba(0,0,0,.35); }

  .aktion { display:block; width:100%; max-width:520px; margin:12px auto 0; padding:14px; font-size:1.05rem; font-weight:600; border:none; border-radius:10px; background:linear-gradient(180deg,#d4af37,#b8932a); color:#1a1405; cursor:pointer; }
  .aktion.zweit { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:normal; font-size:.92rem; }
  textarea { width:100%; max-width:820px; display:block; margin:14px auto 0; height:300px; background:#0b0b0f; color:#d6d6db; border:1px solid var(--line); border-radius:10px; padding:12px; font-family:Consolas,Menlo,monospace; font-size:.78rem; }
  .hinweis { text-align:center; font-size:.85rem; opacity:.75; margin:12px 0 0; }
  #meldung { text-align:center; min-height:1.4em; color:var(--gold); margin-top:10px; font-size:.9rem; }
  .warn { background:rgba(212,175,55,.12); border:1px solid rgba(212,175,55,.4); color:#f3e7c0; padding:8px 12px; border-radius:8px; font-size:.85rem; margin-bottom:12px; }

  /* Türchen-Auswahl */
  .gestern-link { display:block; max-width:520px; margin:0 auto 18px; padding:12px 16px; text-align:center; border-radius:12px; border:1px solid rgba(212,175,55,.6); background:rgba(212,175,55,.12); color:#f3e7c0; font-size:.98rem; cursor:pointer; width:100%; font-family:inherit; }
  .gestern-link b { color:#fff; }
  .raster { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; }
  .kachel { position:relative; display:block; padding:0; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#101014; cursor:pointer; aspect-ratio:2/1.35; text-align:left; font-family:inherit; color:var(--text); }
  .kachel img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.72) saturate(.9); transition:filter .2s, transform .3s; }
  .kachel:hover img { filter:brightness(.9); transform:scale(1.03); }
  .kachel::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.88) 100%); pointer-events:none; }
  .kachel .nr2 { position:absolute; z-index:2; top:8px; left:10px; font-family:Georgia,serif; font-size:1.7rem; line-height:1; color:#fff; text-shadow:0 1px 6px #000; }
  .kachel .mk { position:absolute; z-index:2; top:9px; right:9px; display:flex; gap:4px; font-size:.95rem; }
  .kachel .mk i { font-style:normal; min-width:26px; text-align:center; padding:1px 5px; border-radius:12px; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); font-size:.78rem; }
  .kachel .mk i.leer { opacity:.55; }
  .kachel .kurz { position:absolute; z-index:2; left:10px; right:10px; bottom:8px; font-size:.74rem; line-height:1.3; color:#eee; text-shadow:0 1px 4px #000; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kachel .kurz small { display:block; font-size:.62rem; letter-spacing:1px; text-transform:uppercase; opacity:.8; margin-bottom:1px; }
  .kachel.gestern { border:2px solid var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.25), 0 0 26px rgba(212,175,55,.45); animation:puls 2.6s ease-in-out infinite; }
  @keyframes puls { 0%,100% { box-shadow:0 0 0 3px rgba(212,175,55,.2), 0 0 16px rgba(212,175,55,.3); } 50% { box-shadow:0 0 0 5px rgba(212,175,55,.35), 0 0 34px rgba(212,175,55,.65); } }
  @media (prefers-reduced-motion: reduce) { .kachel.gestern { animation:none; } }
  .kachel.gestern .band { position:absolute; z-index:3; left:0; top:0; background:var(--gold); color:#1a1405; font-size:.64rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:2px 10px; border-radius:0 0 10px 0; }
  .kachel.gestern .nr2 { top:22px; }
  .kachel.her { --c:#d2507f; } .kachel.his { --c:#4a8fe0; }
  .kachel { border:2px solid color-mix(in srgb, var(--c) 70%, #000); box-shadow:inset 0 -26px 40px -20px color-mix(in srgb, var(--c) 55%, transparent); }
  .kachel .kurz { -webkit-line-clamp:3; font-size:.76rem; }
  .kachel .nr2 { text-shadow:0 1px 6px #000, 0 0 14px color-mix(in srgb, var(--c) 80%, transparent); }
  .kachel.geaendert { outline:1px solid rgba(212,175,55,.7); }
  .navzeile { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:10px; margin:18px 0 0; }
  .navzeile button { padding:14px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.16); background:linear-gradient(180deg,#24242c,#18181e); color:#fff; font-size:.95rem; font-weight:600; letter-spacing:.3px; cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .navzeile button:active { transform:translateY(1px); }
  .navzeile button:hover { border-color:var(--gold); }
  .navzeile button.mitte { background:linear-gradient(180deg,#d4af37,#b8932a); color:#1a1405; border-color:#d4af37; }
  .navzeile button[disabled] { opacity:.3; cursor:default; box-shadow:none; }
  /* Randbanner For Him / For Her */
  .rand { position:fixed; left:0; top:50%; transform:translateY(-50%) rotate(180deg); writing-mode:vertical-rl; z-index:5; padding:14px 3px; font-size:.58rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#fff; background:var(--c); border-radius:0 7px 7px 0; box-shadow:0 0 10px rgba(0,0,0,.5); opacity:.92; pointer-events:none; }
  .rand.her { --c:#d2507f; } .rand.his { --c:#4a8fe0; }
  body.detail header, body.detail .leiste { display:none; }
  body.ansicht .leiste { display:none; }
  .gh select { font-family:inherit; }
  .gh textarea { height:auto; max-width:none; margin:6px 0 0; font-family:inherit; }
  body.detail .wrap { padding-top:18px; }
  /* GitHub-Upload */
  .gh { max-width:520px; margin:22px auto 0; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.03); font-size:.88rem; }
  .gh h3 { margin:0 0 8px; font-size:.78rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .gh label { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .gh input[type=password], .gh input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0b0b0f; color:var(--text); font-size:.9rem; font-family:Consolas,Menlo,monospace; }
  .gh .zeile2 { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .gh button.mini { padding:8px 14px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--text); cursor:pointer; font-size:.82rem; font-family:inherit; }
  .gh .ok { color:#7fd6a0; } .gh .fehler { color:#ff9aa8; }
  .gh ul { margin:8px 0 0; padding-left:18px; }
  /* Filter */
  .filter { display:flex; justify-content:center; margin:0 0 16px; }
  .filter button { padding:8px 16px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); font-size:.85rem; cursor:pointer; font-family:inherit; }
  .filter button.an { border-color:var(--gold); background:rgba(212,175,55,.18); color:#f3e7c0; }
  .leer-hinweis { text-align:center; padding:30px 10px; opacity:.8; }
  /* schlanke Kopfleiste */
  .leiste-in { font-size:.82rem; row-gap:6px; }
  .leiste-in .bar { order:3; flex:1 1 100%; height:4px; }
  .zeile .bild { display:block; width:calc(100% + 40px); margin:-18px -20px 14px; border-radius:9px 9px 0 0; max-height:340px; object-fit:cover; }
  .gtag { display:inline-block; margin-left:8px; padding:2px 10px; border-radius:20px; background:var(--gold); color:#1a1405; font-size:.68rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; vertical-align:middle; font-family:'Segoe UI',sans-serif; }
  @media (max-width: 700px) {
    .raster { grid-template-columns:1fr 1fr; gap:10px; }
    .kachel .kurz { font-size:.7rem; }
    .optionen { grid-template-columns:1fr; }
    .karte { margin-left:0; }
    .btns { width:100%; } .btns button { flex:1; justify-content:center; padding:10px 6px; }
    h1 { font-size:1.6rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>His Rating</h1>
    <p class="sub">Türchen antippen und bewerten, wann du willst. Am Ende erzeugst du daraus die fertige <b>er.js</b>.</p>
  </header>
  <div class="leiste"><div class="leiste-in">
    <span id="zaehler">0 von 24 bewertet</span>
    <span class="chip-diff" id="diff">0 geändert</span>
    <div class="bar"><i id="balken"></i></div>
  </div></div>

  <div id="liste"></div>

  <div id="unten">
  <button class="aktion" onclick="exportieren()">er.js erzeugen</button>
  <button class="aktion zweit" onclick="ladeAusDatei(false, true)">Auswahl auf den Stand der er.js zurücksetzen</button>
  <div id="meldung"></div>
  <div id="exportBox" style="display:none;">
    <textarea id="exportText" readonly></textarea>
    <button class="aktion" onclick="kopieren()">In die Zwischenablage kopieren</button>
    <button class="aktion zweit" onclick="herunterladen()">Als er.js herunterladen</button>
    <p class="hinweis">Oder von Hand: auf GitHub im Live-Repo die Datei <b>er.js</b> durch diesen Inhalt ersetzen (und im Test-Repo gern ebenfalls).</p>
  </div>
  <button class="aktion zweit" id="teilenBtn" style="display:none" onclick="teilen()">er.js teilen …</button>
  <div class="gh"><h3>Ihre Antworten</h3><button class="aktion" onclick="location.hash='antworten'">Ihre Antworten ansehen</button><button class="aktion zweit" onclick="location.hash='einrichtung'">Sicherung einrichten</button></div>
  <div class="gh" id="gh">
    <h3>An GitHub senden</h3>
    <label><input type="checkbox" id="ghTest" checked> TEST (vanallen84/testkalender)</label>
    <label><input type="checkbox" id="ghLive"> LIVE (VanAllen84/advent26)</label>
    <div id="ghTokenBox"></div>
    <button class="aktion" id="ghSenden" onclick="anGithub()" style="margin-top:14px">er.js jetzt an GitHub senden</button>
    <div id="ghErgebnis" class="hinweis"></div>
  </div>
  </div>
</div>

<script>
const TAGE = [{"d": 1, "k": 8, "c": 0, "w": "Sie"}, {"d": 2, "k": 23, "c": 0, "w": "Er"}, {"d": 3, "k": 10, "c": 0, "w": "Sie"}, {"d": 4, "k": 24, "c": 0, "w": "Er"}, {"d": 5, "k": 7, "c": 0, "w": "Sie"}, {"d": 6, "k": 20, "c": 0, "w": "Er"}, {"d": 7, "k": 3, "c": 1, "w": "Sie"}, {"d": 8, "k": 17, "c": 1, "w": "Er"}, {"d": 9, "k": 9, "c": 1, "w": "Sie"}, {"d": 10, "k": 18, "c": 1, "w": "Er"}, {"d": 11, "k": 12, "c": 1, "w": "Sie"}, {"d": 12, "k": 21, "c": 1, "w": "Er"}, {"d": 13, "k": 6, "c": 2, "w": "Sie"}, {"d": 14, "k": 14, "c": 2, "w": "Er"}, {"d": 15, "k": 4, "c": 2, "w": "Sie"}, {"d": 16, "k": 19, "c": 2, "w": "Er"}, {"d": 17, "k": 11, "c": 2, "w": "Sie"}, {"d": 18, "k": 22, "c": 2, "w": "Er"}, {"d": 19, "k": 1, "c": 3, "w": "Sie"}, {"d": 20, "k": 13, "c": 3, "w": "Er"}, {"d": 21, "k": 2, "c": 3, "w": "Sie"}, {"d": 22, "k": 16, "c": 3, "w": "Er"}, {"d": 23, "k": 5, "c": 3, "w": "Sie"}, {"d": 24, "k": 15, "c": 3, "w": "Er"}];
const KAT = ["Kategorie 1 · Vorfreude & Verführung","Kategorie 2 · Spiel & Abenteuer","Kategorie 3 · Hingabe & Intensität","Kategorie 4 · Wild & Leidenschaftlich"];
const KEY = "adventErEditor26";
const SYM = { A: "👍", B: "😐", C: "👎" };
const TXT = { A: "Gefiel mir", B: "War OK", C: "Nicht nochmal" };
let wahl = {};            // { tag: { a: "A"|"B"|"C", b: ... } }
let karten = null;        // Kartentexte aus data.js (nicht im Klartext in dieser Datei)
let kartenStatus = "lädt";
let base = {};            // Stand aus er.js (zum Vergleichen)

function sichern() { try { localStorage.setItem(KEY, JSON.stringify(wahl)); } catch (e) {} }
function laden() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY) || "null");
    if (r && typeof r === "object") {
      // ältere Form (ein Buchstabe pro Türchen) = Aufgabe
      Object.keys(r).forEach(d => { if (typeof r[d] === "string") r[d] = { a: r[d] }; });
      wahl = r; return true;
    }
  } catch (e) {} return false;
}
const VER = [["a", "A", "Aufgabe"], ["b", "B", "Alternative"]];
function wert(o, d, v) { return (o[d] && o[d][v]) || ""; }
function meldung(t) { document.getElementById("meldung").innerText = t; }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

const GESTERN = (function () {
  // Gestern bezieht sich auf den Dezember (Türchen 1 bis 24). Zum Ausprobieren: ?heute=12 (dann ist gestern Türchen 11)
  const q = new URLSearchParams(location.search).get("heute");
  if (q && /^\d+$/.test(q)) { const g = Number(q) - 1; return g >= 1 && g <= 24 ? g : 0; }
  const d = new Date();
  if (d.getFullYear() === 2026 && d.getMonth() === 11) {
    const g = d.getDate() - 1;
    return g >= 1 && g <= 24 ? g : 0;
  }
  return 0;
})();
let nurOffen = false;
function bildUrl(t) { return "bilder/karte-" + String(t.k).padStart(2, "0") + ".jpg"; }
function aktuellerTag() { const m = /^#t=(\d+)$/.exec(location.hash); const d = m ? Number(m[1]) : 0; return TAGE.some(t => t.d === d) ? d : 0; }
function oeffne(d) { location.hash = "t=" + d; }
function zurueck() { location.hash = ""; }
function kurzText(k) {
  if (!k || !k.a) return "";
  const satz = String(k.a).split(/(?<=[.!?])\s/)[0];
  return satz.length > 140 ? satz.slice(0, 137).replace(/\s+\S*$/, "") + " …" : satz;
}
function baueZeile(t) {
    const k = karten ? karten[t.k] : null;
    const her = (k ? k.w : t.w) !== "Er";
    const geaendert = VER.some(v => wert(wahl, t.d, v[0]) !== wert(base, t.d, v[0]));
    const z = document.createElement("div");
    z.className = "zeile " + (her ? "her" : "his") + (geaendert ? " geaendert" : "");
    let optionen = '<div class="optionen">';
    VER.forEach(v => {
      const w = wert(wahl, t.d, v[0]), bis = wert(base, t.d, v[0]);
      const diff = w !== bis;
      const text = k ? esc(v[0] === "a" ? k.a : k.b) : "";
      const aktuell = w ? SYM[w] + " " + TXT[w] : "nicht gemacht / nicht bewertet";
      const alt = diff ? '<span class="alt">geändert · bisher in er.js: ' + (bis ? SYM[bis] + " " + TXT[bis] : "nicht bewertet") + '</span>' : "";
      optionen += '<div class="opt' + (w ? " bew-" + w : "") + (diff ? " diff" : "") + '"><b><span>' + v[1] + '</span>' + (v[0] === "a" ? "Die Aufgabe" : "Die Alternative") + '</b>' +
        (v[0] === "b" ? '<em>wenn die Aufgabe nicht möglich ist</em>' : '') +
        '<div class="text">' + text + '</div>' +
        '<div class="status">Aktuell: <b>' + aktuell + '</b>' + alt + '</div><div class="btns">' +
        ["A","B","C"].map(c => '<button class="' + c + (w === c ? " sel" : "") + '" onclick="setze(' + t.d + ',\'' + v[0] + '\',\'' + c + '\')" title="' + TXT[c] + '"><span class="e">' + SYM[c] + '</span><span>' + TXT[c] + '</span></button>').join("") +
        '</div></div>';
    });

  return JSON.parse(new TextDecoder().decode(klar));
}
async function workerGet(pfad, token) {
  const c = cfg(); if (!c.url) throw new Error("Es ist noch keine Worker-Adresse eingetragen (Einrichtung).");
  let r; try { r = await fetch(c.url.replace(/\/+$/, "") + pfad, { headers: { "X-Admin": token }, cache: "no-store" }); } catch (e) { throw new Error("Der Worker ist nicht erreichbar (Adresse prüfen oder Netz)."); }
  if (r.status === 401) throw new Error("Der Worker lehnt den Zugang ab (Zugangs-Hash in Cloudflare prüfen).");
  if (r.status === 404) throw new Error("Noch keine Sicherung vorhanden.");
  if (!r.ok) throw new Error("Worker antwortete mit Status " + r.status + ".");
  return r.json();
}
